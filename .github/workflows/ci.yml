name: CI

# Build va test tren ubuntu vi day la phan re va nhanh nhat: toan bo logic
# nghiep vu nam trong Core (net8.0) va khong can Windows. Job windows chi de
# xac nhan lop adapter bien dich duoc va exe chay len duoc.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Doc phien ban TU global.json, khong ghi cung o day.
      # Runner cua GitHub co san .NET 10 SDK, ma `dotnet build` luon chon SDK
      # MOI NHAT tren may - khong ghim thi CI build bang .NET 10 con may dev
      # build bang .NET 8, ra hai ket qua phan tich khac nhau.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        # --locked-mode: goi NuGet phai TRUNG packages.lock.json (Scorecard Pinned-Dependencies, AN1).
        # Doi goi => chay `dotnet restore Tsudev.SystemAudit.sln --force-evaluate` roi commit lock file.
        run: dotnet restore Tsudev.SystemAudit.sln --locked-mode

      # Cong audit (AN1 B2): goi NuGet co lo hong da cong bo (ke ca goi bac cau) => do.
      - name: Kiem lo hong goi NuGet
        run: |
          dotnet list Tsudev.SystemAudit.sln package --vulnerable --include-transitive | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Co goi NuGet dinh lo hong - xem log o tren"; exit 1
          fi

      - name: Build
        run: dotnet build Tsudev.SystemAudit.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/unittests -c Release --no-build --logger "console;verbosity=normal"

      # Bat so hieu sai quy uoc ngay tu luc PR, thay vi doi den luc gan tag va
      # phat hien ra khi quy trinh phat hanh da chay duoc nua duong.
      - name: Kiem tra VersionPrefix dung quy uoc dat ten
        run: |
          v=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -1)
          echo "VersionPrefix = $v"
          dotnet run --project tests/unittests -c Release --no-build -- --validate-release-name "$v"

  # Trang swico.tsudev.com doc README, PRIVACY, bo luat... luc build: sua cac tep
  # do ma lam gay trang (mat muc README, lien ket noi bo gay, mo ta sai do dai)
  # thi bat o day, khong doi toi luc deploy.
  website:
    name: Website (build + kiem tra)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Tài sản thương hiệu khớp ảnh gốc (brand-assets --check)
        run: node scripts/brand-assets.mjs --check
      - name: Build + check-dist
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cai Chromium cho kiem tra trong trinh duyet
        run: npx playwright install --with-deps chromium
      - name: Kiem tra kha nang truy cap (axe-core, WCAG 2.2 AA, Sang + Toi)
        run: npm run check:a11y
      - name: Kiem tra bo chon giao dien (3 lua chon, mac dinh Toi, CSP production)
        run: npm run check:theme

  smoke-windows:
    name: Smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Doc phien ban TU global.json, khong ghi cung o day.
      # Runner cua GitHub co san .NET 10 SDK, ma `dotnet build` luon chon SDK
      # MOI NHAT tren may - khong ghim thi CI build bang .NET 10 con may dev
      # build bang .NET 8, ra hai ket qua phan tich khac nhau.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Publish single-file exe
        run: dotnet publish src/Tsudev.Audit.Cli -c Release -r win-x64 -o publish

      - name: Run --help
        run: ./publish/swico.exe --help

      # Bien dich THU bo cai o moi PR: truoc day ISCC chi chay luc gan tag (release.yml), nen
      # doi icon/anh trinh thuat si/.iss ma hong thi toi luc phat hanh moi lo. Kem cong
      # BRAND_ASSETS.md muc 12.2 cho desktop: icon exe + bo cai PHAI lay tu day chuyen
      # assets/brand/app/ (brand-assets.mjs --check o job website canh noi dung).
      - name: Bien dich thu bo cai (Inno Setup) + cong tai san nhan dien
        shell: pwsh
        run: |
          if (-not (Select-String -Path src/Tsudev.Audit.Cli/Tsudev.Audit.Cli.csproj -SimpleMatch '<ApplicationIcon>../../assets/brand/app/app.ico</ApplicationIcon>' -Quiet)) {
            throw 'ApplicationIcon phai tro assets/brand/app/app.ico (BRAND_ASSETS.md muc 15)'
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Khong tim thay Inno Setup 6 tai $iscc" }
          Write-Host "ISCC: $((Get-Item $iscc).VersionInfo.ProductVersion)"
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1
          & $iscc "/DAppVersion=$v" packaging\innosetup\swico.iss
          if ($LASTEXITCODE -ne 0) { throw 'Bien dich bo cai THAT BAI' }
          Get-ChildItem packaging/output/tsuswico_*_windows-x64-setup.exe | ForEach-Object { Write-Host "$($_.Name) $($_.Length) byte" }

      # QUET THAT tren runner Windows va kiem tra DU LIEU CO THUC hay khong.
      #
      # Buoc nay ton tai vi mot loi that da tung xay ra: bat PublishTrimmed lam
      # file setup nho di 3 lan nhung KHIEN WMI tra ve gan nhu khong gi ca -
      # chuong trinh van chay, van sinh du file, bao cao nhin binh thuong, chi
      # la THIEU DU LIEU. Kiem tra "co sinh ra file khong" hoan toan khong bat
      # duoc loi kieu do.
      #
      # Muon thu lai mot thiet lap toi uu hoa nao (cat tia, NativeAOT...): them
      # mot buoc publish thu hai voi thiet lap khac roi so sanh So dong va Tom
      # tat cua hai ban tren CUNG mot may. Khac nhau = thiet lap do lam mat du
      # lieu. Do la cach duy nhat phat hien duoc.
      - name: Quet that va kiem tra du lieu co thuc
        shell: pwsh
        run: |
          # Giu lai dau ra de kiem tra ca NOI DUNG lan CACH no duoc in ra.
          $out = ./publish/swico.exe --scope hardware --silent --no-update-check --no-csv -o out --log-file out/swico.jsonl 2>&1
          $exit = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($exit -ge 2) { throw "Quet that bai voi ma thoat $exit" }

          # --- Tien trinh quet phai duoc bao theo TUNG BUOC ---
          #
          # Truoc day ca lan quet chi in ba dong "[1] Dang..." roi im lang hang
          # phut. Buoc kiem tra nay giu cho dieu do khong quay lai: moi buoc thu
          # thap phai co mot dong rieng, kem thoi gian that cua chinh no.
          #
          # Dau tick la "✓" khi console doc duoc UTF-8 va "+" khi khong - chap
          # nhan ca hai, vi ma trang cua runner khong phai thu ta kiem soat.
          $steps = @($out | Where-Object { $_ -match '^\s+(\u2713|\+)\s' })
          Write-Host "So buoc duoc bao: $($steps.Count)"
          if ($steps.Count -lt 10) {
            throw "Chi co $($steps.Count) buoc duoc bao - quet phan cung phai bao >= 10 buoc"
          }

          $timed = @($steps | Where-Object { $_ -match '\d+\.\d+ s\s*$' })
          if ($timed.Count -lt $steps.Count) {
            throw "$($steps.Count - $timed.Count) buoc khong kem thoi gian chay"
          }

          # CHI dung nhan ASCII o day. Nhan buoc co dau tieng Viet, ma ma trang
          # console cua runner khong phai thu ta kiem soat - doi chieu chuoi co
          # dau se bien mot buoc kiem tra dang tin thanh mot buoc do dong bong.
          foreach ($need in @('CPU', 'RAM', 'Windows Defender')) {
            if (-not ($steps -match [regex]::Escape($need))) {
              throw "Thieu buoc '$need' trong danh sach tien trinh"
            }
          }
          Write-Host "Tien trinh quet: $($steps.Count) buoc, tat ca deu co thoi gian rieng"

          $json = Get-ChildItem -Recurse out -Filter *.json | Select-Object -First 1
          $html = Get-ChildItem -Recurse out -Filter *.html | Select-Object -First 1
          $xlsx = Get-ChildItem -Recurse out -Filter *.xlsx | Select-Object -First 1
          foreach ($f in @(@{n='json';v=$json}, @{n='html';v=$html}, @{n='xlsx';v=$xlsx})) {
            if (-not $f.v) { throw "Khong sinh ra file .$($f.n)" }
          }

          $d = Get-Content $json.FullName -Raw | ConvertFrom-Json
          if (-not $d.computerName)  { throw 'JSON thieu computerName' }
          if (-not $d.schemaVersion) { throw 'JSON thieu schemaVersion' }
          if ($d.sections.Count -lt 3) { throw "JSON chi co $($d.sections.Count) muc" }

          $rows = 0
          foreach ($sec in $d.sections) { foreach ($t in $sec.tables) { $rows += $t.rows.Count } }
          Write-Host "So dong du lieu : $rows"
          Write-Host "Tom tat phan cung: $($d.hardwareSummary)"

          # WMI phai tra ve DU LIEU THAT. Ba kiem tra duoi day chinh la nhung gi
          # da phat hien ra su co cat tia.
          if ($rows -lt 12) {
            throw "Chi thu duoc $rows dong - WMI khong tra ve du du lieu (may ao CI binh thuong cho ~15)"
          }
          if (-not $d.hardwareSummary) { throw 'Thieu tom tat phan cung' }
          if ($d.hardwareSummary -match '0 CPU') {
            throw "Tom tat bao 0 CPU - Win32_Processor khong tra ve gi: '$($d.hardwareSummary)'"
          }
          if ($d.hardwareSummary -match '^\s*-\s+-') {
            throw "Hang va model deu rong - Win32_ComputerSystem khong tra ve gi: '$($d.hardwareSummary)'"
          }

          # .xlsx phai la goi OPC hop le, khong phai file rong
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($xlsx.FullName)
          $parts = $zip.Entries.FullName; $zip.Dispose()
          foreach ($need in @('xl/workbook.xml','xl/styles.xml','[Content_Types].xml')) {
            if ($parts -notcontains $need) { throw "File .xlsx thieu phan $need" }
          }
          Write-Host "File .xlsx co $($parts.Count) phan - hop le"

          # --- Nhat ky co cau truc (--log-file, docs/STATE.md 3.5) ---
          # Moi dong la JSON; co run.start, du buoc step.ok kem ms, va run.end
          # mang DUNG ma thoat cua tien trinh.
          $log = @(Get-Content out/swico.jsonl -Encoding utf8 | ForEach-Object { $_ | ConvertFrom-Json })
          $ev = $log | ForEach-Object { $_.event }
          if ($ev[0] -ne 'run.start') { throw "Dong dau nhat ky khong phai run.start: $($ev[0])" }
          $ok = @($log | Where-Object { $_.event -eq 'step.ok' -and $null -ne $_.ms })
          if ($ok.Count -lt 10) { throw "Nhat ky chi co $($ok.Count) step.ok kem ms" }
          $end = $log[-1]
          if ($end.event -ne 'run.end' -or $end.exit_code -ne $exit) {
            throw "Dong cuoi nhat ky phai la run.end voi exit_code=$exit, thay: $($end | ConvertTo-Json -Compress)"
          }
          Write-Host "Nhat ky: $($log.Count) dong, $($ok.Count) step.ok, run.end exit_code=$($end.exit_code)"

          # swico.exe tra ve 1 khi co muc thieu du lieu (vi du Defender tren may
          # ao). Do KHONG phai loi cua buoc nay, nen phai dat lai de GitHub
          # khong coi ca buoc la that bai.
          exit 0

      # PRODUCT_POLICY muc 1 (phieu T3) + STATE 3.5-4: chay that tren Windows.
      #  - Runner la Windows tieng Anh => khong --lang thi giao dien PHAI la tieng Anh;
      #    --lang vi / TSUSWICO_LANG=vi thi PHAI la tieng Viet (lua chon thang he thong).
      #  - --json-only: stdout CHI la mot tai lieu JSON hop le, khong ghi tep nao.
      - name: Ngon ngu theo he thong va --json-only
        shell: pwsh
        run: |
          $help = (./publish/swico.exe --help) -join "`n"
          if ($help -notmatch 'USAGE:') { throw 'Windows tieng Anh nhung tro giup khong phai tieng Anh' }
          $vi = (./publish/swico.exe --help --lang vi) -join "`n"
          if ($vi -notmatch 'THAM S') { throw '--lang vi khong doi tro giup sang tieng Viet' }
          $env:TSUSWICO_LANG = 'vi'
          $envVi = (./publish/swico.exe --help) -join "`n"
          Remove-Item Env:TSUSWICO_LANG
          if ($envVi -notmatch 'THAM S') { throw 'TSUSWICO_LANG=vi khong co tac dung' }

          $before = @(Get-ChildItem -Recurse -File . -Filter *.html).Count
          ./publish/swico.exe --scope hardware --json-only --no-update-check --no-dism 1> json-only.json 2> json-only.log
          $exit = $LASTEXITCODE
          Get-Content json-only.log | ForEach-Object { Write-Host $_ }
          if ($exit -ge 2) { throw "--json-only thoat voi ma $exit" }
          $doc = Get-Content json-only.json -Raw | ConvertFrom-Json
          if ($doc.tool -ne 'Tsu Swico') { throw 'JSON thieu truong tool' }
          if ($doc.language -ne 'en') { throw "Ngon ngu bao cao '$($doc.language)', mong doi 'en'" }
          if ($doc.reports.Count -ne 1) { throw "Mong doi 1 bao cao, co $($doc.reports.Count)" }
          if (-not $doc.reports[0].computerName) { throw 'Bao cao JSON thieu computerName' }
          $after = @(Get-ChildItem -Recurse -File . -Filter *.html).Count
          if ($after -ne $before) { throw '--json-only van ghi tep HTML' }
          Write-Host "--json-only: JSON hop le, $($doc.reports[0].sections.Count) muc, khong ghi tep"
          exit 0

      # Tai khoan TsuDEV (PRO1 P3) - hang C tren Windows THAT: sau moi lan quet o tren va cac lenh
      # tai khoan khi CHUA dang nhap, %LOCALAPPDATA%\tsudev\tsuswico\ PHAI khong ton tai (khong tep,
      # khong mang - phan "khong mang" do ProOfflineGuardTests canh). login/account voi --silent
      # hoac --json-only PHAI bi tu choi (ma 3): chung chi chay tuong tac.
      - name: Lenh tai khoan khi chua dang nhap
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'tsudev\tsuswico'
          if (Test-Path $dir) { throw "Lan quet chua dang nhap da tao $dir" }
          $acc = (./publish/swico.exe account) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "account thoat voi ma $LASTEXITCODE" }
          if ($acc -notmatch 'Not signed in') { throw "account khong bao chua dang nhap: $acc" }
          ./publish/swico.exe logout | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "logout thoat voi ma $LASTEXITCODE" }
          ./publish/swico.exe login --silent 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 3) { throw "login --silent phai bi tu choi (3), nhan $LASTEXITCODE" }
          ./publish/swico.exe account --json-only 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 3) { throw "account --json-only phai bi tu choi (3), nhan $LASTEXITCODE" }
          if (Test-Path $dir) { throw "Lenh tai khoan khi chua dang nhap da tao $dir" }
          Write-Host 'Lenh tai khoan: hang C dat (khong tep), che do khong tuong tac bi tu choi'
          exit 0

      - name: Luu ket qua quet de doi chieu khi can
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ket-qua-quet-${{ github.sha }}
          path: out/**/*.json
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swico-unsigned-${{ github.sha }}
          path: publish/swico.exe
          retention-days: 14
