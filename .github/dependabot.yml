# Cap nhat phu thuoc tu dong (Scorecard Dependency-Update-Tool; OpenSSF Best Practices dependency_monitoring).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
    # Goi runtime ban 11+ bao "doesn't support net8.0" (khong nham net8). Bo khi
    # chuyen TargetFramework sang net10 (viec NET10 trong logs/STATE.md).
    ignore:
      - dependency-name: 'System.Management'
        versions: ['>= 11']
      - dependency-name: 'System.CodeDom'
        versions: ['>= 11']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website:
        patterns: ['*']
